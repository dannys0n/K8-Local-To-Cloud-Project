apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.tcp-lab.svc.cluster.local:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    editable: false
    jsonData:
      authType: default
      defaultRegion: us-east-1
