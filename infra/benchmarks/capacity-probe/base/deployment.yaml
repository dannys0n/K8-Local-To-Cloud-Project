apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-probe
  namespace: tcp-lab-benchmark
  labels:
    app.kubernetes.io/name: capacity-probe
    app.kubernetes.io/part-of: tcp-lab-capacity-benchmark
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 100%
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity-probe
        app.kubernetes.io/part-of: tcp-lab-capacity-benchmark
        benchmark.tcp-lab.io/run: idle
    spec:
      terminationGracePeriodSeconds: 1
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0
      containers:
        - name: probe
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CPU_LOAD
              value: "false"
            - name: STARTUP_DELAY_SECONDS
              value: "0"
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              sleep "$STARTUP_DELAY_SECONDS"
              mkdir -p /www
              printf 'ready\n' > /www/index.html
              httpd -f -p 8080 -h /www &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' TERM INT EXIT
              if [ "$CPU_LOAD" = "true" ]; then
                while kill -0 "$server_pid" 2>/dev/null; do
                  if [ -f /tmp/stop-load ]; then
                    wait "$server_pid"
                    break
                  fi
                  value=0
                  while [ "$value" -lt 20000 ]; do value=$((value + 1)); done
                done
              else
                wait "$server_pid"
              fi
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
