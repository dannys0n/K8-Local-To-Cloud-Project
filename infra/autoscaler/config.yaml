evaluate:
  type: shell
  timeout: 2500
  shell:
    entrypoint: python
    command: ["/evaluate.py"]
metric:
  type: shell
  timeout: 2500
  shell:
    entrypoint: python
    command: ["/metric.py"]
postScale:
  type: shell
  timeout: 5000
  shell:
    entrypoint: python
    command: ["/post_scale.py"]
kubernetesMetricSpecs:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
requireKubernetesMetrics: true
runMode: per-resource
minReplicas: 1
maxReplicas: 500
apiConfig:
  enabled: false
