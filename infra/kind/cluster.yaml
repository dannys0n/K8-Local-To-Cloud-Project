kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tcp-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            housekeeping-interval: "1s"
      - |
        kind: ClusterConfiguration
        controllerManager:
          extraArgs:
            node-monitor-grace-period: "5s"
            node-monitor-period: "1s"
            node-eviction-rate: "10"
            secondary-node-eviction-rate: "10"
            large-cluster-size-threshold: "1"
      - |
        apiVersion: kubelet.config.k8s.io/v1beta1
        kind: KubeletConfiguration
        nodeStatusUpdateFrequency: 1s
    extraPortMappings:
      - containerPort: 30000
        hostPort: 9000
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30001
        hostPort: 8404
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    kubeadmConfigPatches: &fastKubelet
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            housekeeping-interval: "1s"
  - role: worker
    kubeadmConfigPatches: *fastKubelet
  - role: worker
    kubeadmConfigPatches: *fastKubelet
  - role: worker
    kubeadmConfigPatches: *fastKubelet
  - role: worker
    kubeadmConfigPatches: *fastKubelet
