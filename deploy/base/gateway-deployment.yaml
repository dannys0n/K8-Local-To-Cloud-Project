apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tcp-lab
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      terminationGracePeriodSeconds: 10
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: gateway
      containers:
        - name: gateway
          image: tcp-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LISTEN_ADDR
              value: ":9000"
            - name: STATS_ADDR
              value: ":8404"
            - name: SERVER_HOST
              value: tcp-server-headless.tcp-lab.svc.cluster.local
            - name: SERVER_PORT
              value: "7000"
            - name: DISCOVERY_INTERVAL
              value: "200ms"
            - name: DISCOVERY_TIMEOUT
              value: "500ms"
            - name: ROUTE_TIMEOUT
              value: "5s"
            - name: BACKEND_TIMEOUT
              value: "3s"
          ports:
            - name: tcp
              containerPort: 9000
              protocol: TCP
            - name: stats
              containerPort: 8404
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: stats
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /healthz
              port: stats
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: stats
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 3
            terminationGracePeriodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 32Mi
            limits:
              memory: 128Mi
