apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: haproxy
  namespace: tcp-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: haproxy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tcp-server
  namespace: tcp-lab
spec:
  minAvailable: 6
  selector:
    matchLabels:
      app: tcp-server
