apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcp-server
  namespace: tcp-lab
spec:
  serviceName: tcp-server-headless
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tcp-server
  template:
    metadata:
      labels:
        app: tcp-server
    spec:
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: tcp-server
      containers:
        - name: server
          image: simple-tcp-server:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LISTEN_ADDR
              value: ":7000"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: tcp-server-databases
                  key: postgres-dsn
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: tcp-server-databases
                  key: redis-addr
          ports:
            - name: tcp
              containerPort: 7000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
