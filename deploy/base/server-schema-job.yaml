apiVersion: batch/v1
kind: Job
metadata:
  name: tcp-server-schema
  namespace: tcp-lab
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: tcp-server-schema
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: simple-tcp-server:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: RUN_SCHEMA_MIGRATION
              value: "true"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: tcp-server-databases
                  key: postgres-dsn
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: tcp-server-databases
                  key: redis-addr
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
