apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-server
  namespace: tcp-lab
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: tcp-server
  template:
    metadata:
      labels:
        app: tcp-server
    spec:
      terminationGracePeriodSeconds: 10
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: tcp-server
      containers:
        - name: server
          image: simple-tcp-server:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LISTEN_ADDR
              value: ":7000"
            - name: SERVER_PORT
              value: "7000"
            - name: ASSIGNMENT_LEASE_DURATION
              value: "3s"
            - name: ASSIGNMENT_RENEW_INTERVAL
              value: "500ms"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: tcp-server-databases
                  key: postgres-dsn
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: tcp-server-databases
                  key: redis-addr
          ports:
            - name: tcp
              containerPort: 7000
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
            terminationGracePeriodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 32Mi
            limits:
              memory: 128Mi
