apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-autoscaler
  namespace: tcp-lab
  labels:
    app: tcp-server-autoscaler
    autoscaling-target: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tcp-server-autoscaler
      autoscaling-target: gateway
  template:
    metadata:
      labels:
        app: tcp-server-autoscaler
        autoscaling-target: gateway
    spec:
      serviceAccountName: workload-autoscaler
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 1
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 0
      containers:
        - name: autoscaler
          image: tcp-server-autoscaler:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SCALE_TARGET
              value: gateway
            - name: CPU_REQUEST_MILLICORES
              value: "250"
            - name: PROMETHEUS_URL
              value: http://prometheus.tcp-lab.svc.cluster.local:9090
            - name: TARGET_POD_PATTERN
              value: gateway-.*
            - name: TARGET_CONTAINER
              value: gateway
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
