apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-autoscaler
  namespace: tcp-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-autoscaler
  namespace: tcp-lab
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-autoscaler
  namespace: tcp-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-autoscaler
subjects:
  - kind: ServiceAccount
    name: workload-autoscaler
    namespace: tcp-lab
