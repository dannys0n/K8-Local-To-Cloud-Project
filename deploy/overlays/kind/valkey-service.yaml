apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: tcp-lab
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: valkey
  ports:
    - name: client
      port: 6379
      targetPort: client
    - name: cluster
      port: 16379
      targetPort: cluster
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: tcp-lab
spec:
  selector:
    app: valkey
  ports:
    - name: client
      port: 6379
      targetPort: client
