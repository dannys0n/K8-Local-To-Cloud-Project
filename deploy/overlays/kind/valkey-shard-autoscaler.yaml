apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey-shard-autoscaler
  namespace: tcp-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: valkey-shard-autoscaler
  namespace: tcp-lab
rules:
  - apiGroups: ["valkey.io"]
    resources: ["valkeyclusters"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: valkey-shard-autoscaler
  namespace: tcp-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: valkey-shard-autoscaler
subjects:
  - kind: ServiceAccount
    name: valkey-shard-autoscaler
    namespace: tcp-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-shard-autoscaler
  namespace: tcp-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey-shard-autoscaler
  template:
    metadata:
      labels:
        app: valkey-shard-autoscaler
    spec:
      serviceAccountName: valkey-shard-autoscaler
      containers:
        - name: autoscaler
          image: valkey-shard-autoscaler:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VALKEY_CLUSTER
              value: tcp-lab
            - name: VALKEY_ADDRESS
              value: valkey.tcp-lab.svc.cluster.local:6379
            - name: VALKEY_CONTAINER
              value: server
            - name: PROMETHEUS_URL
              value: http://prometheus.tcp-lab.svc.cluster.local:9090
            - name: CPU_REQUEST_MILLICORES
              value: "500"
            - name: SCALE_UP_PERCENT
              value: "70"
            - name: SCALE_DOWN_PERCENT
              value: "52.5"
            - name: REQUIRED_BREACHES
              value: "2"
            - name: EVALUATION_INTERVAL_SECONDS
              value: "1"
            - name: SCALE_COOLDOWN_SECONDS
              value: "2"
            - name: MIN_SHARDS
              value: "3"
            - name: MAX_SHARDS
              value: "100"
            - name: MINIMUM_SCALE_OUT_PERCENT
              value: "50"
            - name: MAXIMUM_SCALE_IN_PERCENT
              value: "50"
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
