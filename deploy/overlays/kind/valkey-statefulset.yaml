apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: tcp-lab
spec:
  serviceName: valkey-headless
  replicas: 6
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: valkey
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          command: ["sh", "-ec"]
          args:
            - |
              exec valkey-server \
                --bind 0.0.0.0 \
                --protected-mode no \
                --appendonly yes \
                --appendfsync everysec \
                --cluster-enabled yes \
                --cluster-config-file /data/nodes.conf \
                --cluster-node-timeout 2000 \
                --cluster-announce-ip "$POD_IP" \
                --cluster-announce-port 6379 \
                --cluster-announce-bus-port 16379
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: client
              containerPort: 6379
            - name: cluster
              containerPort: 16379
          readinessProbe:
            exec:
              command: ["sh", "-ec", "valkey-cli ping | grep -q PONG"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-ec", "valkey-cli ping | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi
