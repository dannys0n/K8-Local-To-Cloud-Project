apiVersion: v1
kind: Secret
metadata:
  name: tcp-server-databases
  namespace: tcp-lab
type: Opaque
stringData:
  postgres-user: tcp_lab
  postgres-password: tcp_lab_local
  postgres-database: tcp_lab
  postgres-dsn: postgres://tcp_lab:tcp_lab_local@postgres:5432/tcp_lab?sslmode=disable
  redis-addr: redis:6379
