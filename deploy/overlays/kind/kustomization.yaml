apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - database-secret.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - redis-service.yaml
  - redis-deployment.yaml
patches:
  - path: gateway-nodeport-patch.yaml
  - path: stats-nodeport-patch.yaml
  - path: gateway-hpa-fast-patch.yaml
  - path: server-autoscaler-fast-patch.yaml
  - path: server-autoscaler-fast-env-patch.yaml
    target:
      group: custompodautoscaler.com
      version: v1
      kind: CustomPodAutoscaler
      name: tcp-server-cpu
      namespace: tcp-lab
