apiVersion: batch/v1
kind: Job
metadata:
  name: valkey-cluster-init
  namespace: tcp-lab
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app: valkey-cluster-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: initialize
          image: valkey/valkey:8.1-alpine
          command: ["sh", "-ec"]
          args:
            - |
              for ordinal in 0 1 2 3 4 5; do
                host="valkey-${ordinal}.valkey-headless.tcp-lab.svc.cluster.local"
                until valkey-cli -h "$host" ping >/dev/null 2>&1; do sleep 1; done
              done
              # The autoscaler forms the cluster after inspecting actual pod-to-worker
              # placement so a replica is never paired with a primary on the same node.
              until valkey-cli -h valkey-0.valkey-headless cluster info | grep -q 'cluster_state:ok'; do sleep 1; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
